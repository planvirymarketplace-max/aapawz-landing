<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <style>
      .stroke-dog { fill: none; stroke: #1b6357; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
      .fill-dog { fill: #1b6357; }
      .stroke-cat { fill: none; stroke: #1c221e; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
      .fill-cat { fill: #1c221e; }
      .stroke-hamster { fill: none; stroke: #eb6720; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; }
      .fill-hamster { fill: #eb6720; }
      .stroke-bird { fill: none; stroke: #1b6357; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
      .fill-bird { fill: #1b6357; }
      .brand-text { font-family: 'Outfit', 'Comfortaa', 'Quicksand', 'Nunito', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 64px; fill: #171916; letter-spacing: -0.5px; }
    </style>
  </defs>

  <!-- 1. BIRD (Perched on dog's head) -->
  <g id="bird">
    <!-- Legs -->
    <line x1="486" y1="288" x2="486" y2="308" class="stroke-bird" stroke-width="7" />
    <line x1="504" y1="288" x2="504" y2="308" class="stroke-bird" stroke-width="7" />
    <!-- Bird body & head -->
    <path d="M 434 227 Q 452 200 488 200 C 516 200 535 218 535 244 C 535 272 506 290 472 290 C 452 290 440 278 440 262 C 440 248 456 242 478 244" class="stroke-bird" />
    <!-- Beak -->
    <path d="M 452 216 L 434 227 L 454 233 Z" class="fill-bird" />
    <!-- Eye -->
    <circle cx="468" cy="222" r="5" class="fill-bird" />
    <!-- Tail feathers -->
    <path d="M 533 246 C 550 240 564 232 572 218 M 531 254 C 548 250 562 242 568 232" class="stroke-bird" stroke-width="9" />
  </g>

  <!-- 2. DOG (Right & Crown) -->
  <g id="dog">
    <!-- Head crown between ears -->
    <path d="M 454 308 Q 495 300 536 308" class="stroke-dog" />
    <!-- Left ear loop -->
    <path d="M 454 308 C 410 310 340 330 312 376 C 290 412 312 458 356 460 C 390 462 422 424 430 380" class="stroke-dog" />
    <!-- Right ear loop -->
    <path d="M 536 308 C 580 310 650 330 678 376 C 700 412 678 458 634 460 C 600 462 568 424 560 380" class="stroke-dog" />
    <!-- Cheeks & bottom outline -->
    <path d="M 430 380 L 430 452 M 560 380 L 560 520 C 560 524 556 528 552 528 L 440 528" class="stroke-dog" />
    <!-- Dog Eyes -->
    <circle cx="462" cy="426" r="11" class="fill-dog" />
    <circle cx="528" cy="426" r="11" class="fill-dog" />
    <!-- Dog Nose (Shield/Heart shape) -->
    <path d="M 470 454 C 470 448 480 446 495 446 C 510 446 520 448 520 454 C 520 472 506 496 495 496 C 484 496 470 472 470 454 Z" class="fill-dog" />
    <line x1="495" y1="496" x2="495" y2="528" class="stroke-dog" stroke-width="12" />
  </g>

  <!-- 3. CAT (Left side) -->
  <g id="cat">
    <!-- Cat head outline with triangular ears -->
    <path d="M 235 528 C 210 528 196 504 196 470 C 196 442 202 414 176 380 C 158 356 168 334 186 338 L 228 392 C 242 376 270 376 284 392 L 326 338 C 344 334 354 356 336 380 C 314 410 320 440 320 470" class="stroke-cat" />
    <!-- Whiskers Left -->
    <line x1="154" y1="432" x2="204" y2="444" class="stroke-cat" stroke-width="11" />
    <line x1="150" y1="458" x2="202" y2="460" class="stroke-cat" stroke-width="11" />
    <line x1="162" y1="486" x2="206" y2="476" class="stroke-cat" stroke-width="11" />
    <!-- Whiskers Right -->
    <line x1="312" y1="444" x2="326" y2="442" class="stroke-cat" stroke-width="11" />
    <line x1="312" y1="460" x2="326" y2="460" class="stroke-cat" stroke-width="11" />
    <line x1="312" y1="476" x2="326" y2="478" class="stroke-cat" stroke-width="11" />
    <!-- Cat Eyes -->
    <circle cx="220" cy="426" r="11" class="fill-cat" />
    <circle cx="282" cy="426" r="11" class="fill-cat" />
    <!-- Cat Nose & Smile -->
    <path d="M 244 454 L 258 454 L 251 462 Z" class="fill-cat" />
    <path d="M 236 468 Q 244 478 251 468 Q 258 478 266 468" class="stroke-cat" stroke-width="8" />
  </g>

  <!-- 4. HAMSTER (Center Foreground) -->
  <g id="hamster">
    <!-- Hamster head with round ears -->
    <path d="M 330 528 C 314 528 308 506 310 478 C 304 466 312 444 332 442 C 346 440 354 452 354 464 C 368 458 382 458 396 464 C 396 452 404 440 418 442 C 438 444 446 466 440 478 C 442 506 436 528 420 528 Z" class="stroke-hamster" />
    <!-- Hamster Eyes -->
    <circle cx="352" cy="482" r="7.5" class="fill-hamster" />
    <circle cx="398" cy="482" r="7.5" class="fill-hamster" />
    <!-- Hamster Nose & Mouth -->
    <circle cx="375" cy="496" r="5" class="fill-hamster" />
    <path d="M 367 504 Q 375 512 375 502 Q 375 512 383 504" class="stroke-hamster" stroke-width="6" />
    <!-- Hamster Chest Paw Print -->
    <g transform="translate(375, 520) scale(0.65)">
      <path d="M -8 0 C -8 -6 0 -8 0 -2 C 0 -8 8 -6 8 0 C 8 8 -8 8 -8 0 Z" class="fill-hamster" />
      <circle cx="-9" cy="-8" r="2.5" class="fill-hamster" />
      <circle cx="-3" cy="-12" r="2.5" class="fill-hamster" />
      <circle cx="3" cy="-12" r="2.5" class="fill-hamster" />
      <circle cx="9" cy="-8" r="2.5" class="fill-hamster" />
    </g>
  </g>

  <!-- 5. BRAND TEXT: all about pawz with paw icon in 'about' -->
  <g id="wordmark">
    <!-- 'all ab' -->
    <text x="154" y="605" class="brand-text">all ab</text>
    
    <!-- Paw print replacing 'o' in 'about' -->
    <g transform="translate(372, 584) scale(1.15)">
      <!-- Main pad (heart-like rounded pad) -->
      <path d="M -13 0 C -15 -10 -2 -14 0 -4 C 2 -14 15 -10 13 0 C 12 12 -12 12 -13 0 Z" fill="#171916" />
      <!-- Toe pads -->
      <circle cx="-13" cy="-13" r="3.8" fill="#171916" />
      <circle cx="-4.5" cy="-18" r="4" fill="#171916" />
      <circle cx="4.5" cy="-18" r="4" fill="#171916" />
      <circle cx="13" cy="-13" r="3.8" fill="#171916" />
    </g>

    <!-- 'ut pawz' -->
    <text x="400" y="605" class="brand-text">ut pawz</text>
  </g>
</svg>